# Workspace Write + MCP: the same workspace-write file/shell boundary and the
# usual approvals for non-MCP tools, with every MCP approval request claimed by
# the plugin below. The plugin registers no tools; it only answers approval
# requests and adds a short system-prompt note.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      workspace-write-mcp:
        sandbox: workspace-write
        approval: ask
        name: Workspace Write + MCP
        description: Write inside the workspace as Workspace Write; every connected
          MCP tool runs without an approval prompt.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
- insert:
    - id: mcp-auto-permission
      name: '@local/dsh-mcp-auto-permission'
      config:
        preset: workspace-write-mcp
        mcpPrefix: mcp__
