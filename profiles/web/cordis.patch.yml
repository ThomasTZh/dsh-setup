- id: llm-openai-codex
  name: dsh-codex
  config:
    models:
      - gpt-6-astra
      - gpt-6-luna
      - gpt-6.1-sol
    automaticModelFallback: false
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max
- id: llm-pi-ai
  config:
    providers:
      llama-cpp:
        displayName: llama.cpp · local Qwen3.8/Gemma-4 catalogue · dual GPU
        api: openai-completions
        headers:
          Authorization: Bearer local-llama
        baseURL: http://127.0.0.1:8080/v1
        timeoutMs: 1800000
        streamIdleTimeoutMs: 1800000
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
          thinkingFormat: chat-template
          requiresThinkingAsText: false
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
            preserve_thinking: false
            preserve_reasoning: false
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
        reasoning: medium
        models:
          - id: gemma-4-31b-it-qat-q4-0-uncensored-heretic-q4-0
            name: Gemma-4-31B QAT Q4_0 Uncensored Heretic · 64K
            input:
              - text
            contextWindow: 65536
            maxTokens: 65536
            reasoningEfforts:
              'off': none
              low: low
              medium: medium
              xhigh: xhigh
          - id: swift-1.5-qwen3.8-27b-q4-k-s
            name: Swift 1.5 Qwen3.8-27B Q4_K_S · 212K
            input:
              - text
            contextWindow: 217088
            maxTokens: 217088
            reasoningEfforts:
              'off': none
              low: low
              medium: medium
              xhigh: xhigh
          - id: swift-1.5-qwen3.8-27b-q4-k-s-vision
            name: Swift 1.5 Qwen3.8-27B Q4_K_S · Vision · 176K
            input:
              - text
              - image
            contextWindow: 180224
            maxTokens: 180224
            reasoningEfforts:
              'off': none
              low: low
              medium: medium
              xhigh: xhigh
- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: system
    fontSize: 20
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: web-ui-pet
  name: "@linxin666/dsh-pet"
  config:
    enabled: false
    decorationEnabled: true
  disabled: true
- id: web-ui-remote-web-ui
  name: "@linxin666/dsh-remote-web-ui"
  disabled: true
- id: web-ui-task-board-github
  disabled: true
- id: web-ui-task-board
  disabled: true
- id: web-ui-remote-bridge
  disabled: true
- id: web-ui-liangshen
  disabled: true
- id: web-ui-skill-explorer
  disabled: false
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    agentOpenTools: true
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-official
        model: deepseek-flash
      - provider: deepseek-official
        model: deepseek-v4-pro
      - provider: openai-codex
        model: gpt-6-astra
      - provider: openai-codex
        model: gpt-6.1-sol
      - provider: openai-codex
        model: gpt-6-luna
